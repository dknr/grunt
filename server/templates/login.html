<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="chat-header">
        <div class="header-inner">
            <div class="brand-icon"></div>
            <h1>Grunt</h1>
        </div>
    </header>

    <div class="login-form">
        <!-- Login form -->
        <form method="post" action="/login" id="login-form">
            <input type="text" name="user" placeholder="Username" required autofocus>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <!-- Register form -->
        <form method="post" action="/register" id="register-form" class="hidden">
            <input type="text" name="user" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <input type="text" name="invite_code" placeholder="Invite code" required>
            <button type="submit">Register</button>
        </form>

        <!-- Toggle between login and register -->
        <a class="toggle-btn" href="#" onclick="toggleAuthForm(); return false;">Don't have an account? Register</a>
        {{if .Error}}<div id="response"><p class="error-message">{{.Error}}</p></div>{{end}}
    </div>

    <script>
        var isRegister = false;

        function toggleAuthForm() {
            var loginForm = document.getElementById('login-form');
            var registerForm = document.getElementById('register-form');
            var toggleLink = document.querySelector('.toggle-btn');

            isRegister = !isRegister;

            if (isRegister) {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                toggleLink.textContent = "Already have an account? Login";
                registerForm.querySelector('input[name="user"]').focus();
            } else {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                toggleLink.textContent = "Don't have an account? Register";
            }
        }
    </script>
</body>
</html>
