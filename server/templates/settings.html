<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Settings</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header class="chat-header">
        <div class="header-inner">
            <div class="brand-icon"></div>
            <h1>Settings</h1>
            <a href="/" class="profile-icon"></a>
        </div>
    </header>

    <main style="flex: 1; overflow-y: auto; display: flex; align-items: center; gap: 8px; padding-top: 8px; padding-bottom: 8px; flex-direction: column;">
        <!-- User Actions Section -->
        <div class="section">
            <h2>Change Password</h2>
            <form hx-post="/api/user/password"
                  hx-target="#password-result"
                  hx-swap="innerHTML"
                  hx-on::before-request="if (this.querySelector('[name=new_password]').value !== this.querySelector('[name=confirm_password]').value) { event.preventDefault(); alert('New passwords do not match'); }">
                <input name="current_password" type="password" placeholder="Current password" required>
                <input name="new_password" type="password" placeholder="New password" required>
                <input name="confirm_password" type="password" placeholder="Confirm new password" required>
                <button type="submit">Change Password</button>
            </form>
            <div id="password-result"></div>
        </div>

        <!-- Admin Actions Section (visible only to admins) -->
        <div id="admin-panel" class="section hidden">
            <h2>Admin Actions</h2>
            <p>Generate a new invite code for registration:</p>
            <button type="button" onclick="generateInvite()">Generate Invite Code</button>
            <div id="invite-result"></div>
        </div>
    </main>

    <script>
        var isAdmin = {{.Admin}};

        // Show admin panel if user is admin
        if (isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        // Generate invite code via API
        function generateInvite() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/user/invite', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    document.getElementById('invite-result').textContent = 'New invite code: ' + resp.code;
                } else {
                    document.getElementById('invite-result').textContent = 'Failed to generate invite code.';
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
