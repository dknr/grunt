<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Settings</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 1.5rem; }
        nav a { color: #0066cc; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #eee; border-radius: 4px; }
        .section h2 { margin-top: 0; font-size: 1.2em; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        #invite-result { margin-top: 0.5rem; font-weight: bold; color: #333; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Settings <nav><a href="/">Back to Chat</a></nav></h1>

    <!-- User Actions Section -->
    <div class="section">
        <h2>User Actions</h2>
        <p>Password management coming soon.</p>
    </div>

    <!-- Admin Actions Section (visible only to admins) -->
    <div id="admin-panel" class="section hidden">
        <h2>Admin Actions</h2>
        <p>Generate a new invite code for registration:</p>
        <button type="button" onclick="generateInvite()">Generate Invite Code</button>
        <div id="invite-result"></div>
    </div>

    <script>
        var isAdmin = {{.Admin}};

        // Show admin panel if user is admin
        if (isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        // Generate invite code via API
        function generateInvite() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/user/invite', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    document.getElementById('invite-result').textContent = 'New invite code: ' + resp.code;
                } else {
                    document.getElementById('invite-result').textContent = 'Failed to generate invite code.';
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
