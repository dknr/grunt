<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.js"></script>
    <script src="/static/ext/sse.js"></script>
</head>
<body>
    <header class="chat-header">
        <div class="header-inner">
            <div class="brand-icon"></div>
            <h1>Grunt</h1>
            <a href="/settings" class="profile-icon"></a>
        </div>
    </header>
    <main id="messages">{{.Messages}}</main>
    <footer class="chat-footer">
        <form hx-post="/api/chat/message"
              hx-swap="none"
              hx-on::after-request="this.reset(); this.querySelector('[name=content]').style.height='auto'">
            <textarea name="content" placeholder="Type a message..." required rows="1" autocomplete="off" autofocus></textarea>
            <div class="send-wrapper">
                <button type="submit" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </form>
    </footer>

    <!-- HTMX SSE listener for live messages -->
    <div hx-ext="sse" 
         sse-connect="/api/chat/stream?format=html" 
         sse-swap="message"
         hx-target="#messages"
         hx-swap="beforeend"
         id="sse-listener"
         style="display:none">
    </div>

    <script>
        var isAdmin = {{.Admin}};

        // Auto-expand textarea as user types
        var textarea = document.querySelector('[name="content"]');
        var form = textarea.closest('form');

        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
</body>
</html>
