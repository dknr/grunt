<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header class="chat-header">
        <div class="header-inner">
            <div class="brand-icon"></div>
            <h1>Grunt</h1>
            <a href="/settings" class="profile-icon"></a>
        </div>
    </header>
    <main id="messages">{{.Messages}}</main>
    <footer class="chat-footer">
        <form hx-post="/api/chat/message"
              hx-swap="none"
              hx-headers='{"Content-Type": "application/json"}'
              hx-on::before-request="event.detail.request.body = JSON.stringify({content: event.detail.request.target.querySelector('[name=content]').value})"
              hx-on::after-request="this.reset(); this.querySelector('[name=content]').style.height='auto'">
            <textarea name="content" placeholder="Type a message..." required rows="1" autocomplete="off"></textarea>
            <div class="send-wrapper">
                <button type="submit" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </form>
    </footer>

    <script>
        var isAdmin = {{.Admin}};

        // Auto-expand textarea as user types
        var textarea = document.querySelector('[name="content"]');
        var form = textarea.closest('form');

        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // Connect to SSE stream using native EventSource
        var source = new EventSource('/api/chat/stream');
        source.addEventListener('message', function(e) {
            var data = JSON.parse(e.data);
            if (data.type === 'message') {
                var div = document.createElement('div');
                div.className = 'message';
                div.setAttribute('data-id', data.id);
                div.innerHTML = '<strong>' + data.user + '</strong>' +
                    '<span class="timestamp">' + new Date(data.timestamp).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'}) + '</span>' +
                    '<p>' + data.content + '</p>';
                document.getElementById('messages').appendChild(div);
            }
        });
    </script>
</body>
</html>
