<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunt Chat</title>
    <script src="/static/htmx.min.js"></script>
    <script>
        var isAdmin = {{.Admin}};
    </script>
    <script src="/static/htmx.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        #messages { margin-bottom: 1rem; }
        .message { padding: 0.5rem; border-bottom: 1px solid #eee; }
        .message strong { color: #333; }
        .message .timestamp { color: #999; font-size: 0.8em; margin-left: 0.5rem; }
        .event { color: #666; font-size: 0.9em; margin: 0.5rem 0; }
        form { display: flex; gap: 0.5rem; }
        form input { flex: 1; padding: 0.5rem; }
        form button { padding: 0.5rem 1rem; }
        #admin-panel { margin-top: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        #invite-result { margin-top: 0.5rem; font-weight: bold; color: #333; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Chat</h1>
    <div id="messages">{{.Messages}}</div>
    <div id="events"></div>
    <form hx-post="/api/chat/message"
          hx-swap="none"
          hx-headers='{"Content-Type": "application/json"}'
          hx-on::before-request="event.detail.request.body = JSON.stringify({content: event.detail.request.target.querySelector('[name=content]').value})"
          hx-on::after-request="this.reset()">
        <input name="content" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>

    <!-- Admin Panel (visible only to admins) -->
    <div id="admin-panel" class="hidden">
        <h2>Admin Panel</h2>
        <p>Generate a new invite code for registration:</p>
        <button type="button" onclick="generateInvite()">Generate Invite Code</button>
        <div id="invite-result"></div>
    </div>

    <script>
        // Connect to SSE stream using native EventSource
        var source = new EventSource('/api/chat/stream');
        source.addEventListener('message', function(e) {
            var data = JSON.parse(e.data);
            if (data.type === 'message') {
                var div = document.createElement('div');
                div.className = 'message';
                div.setAttribute('data-id', data.id);
                div.innerHTML = '<strong>' + data.user + '</strong>' +
                    '<span class="timestamp">' + new Date(data.timestamp).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'}) + '</span>' +
                    '<p>' + data.content + '</p>';
                document.getElementById('messages').appendChild(div);
            } else if (data.type === 'event') {
                var div = document.createElement('div');
                div.className = 'event';
                div.textContent = data.user + ' ' + data.event;
                document.getElementById('events').appendChild(div);
            }
        });
        source.addEventListener('event', function(e) {
            var data = JSON.parse(e.data);
            var div = document.createElement('div');
            div.className = 'event';
            div.textContent = data.user + ' ' + data.event;
            document.getElementById('events').appendChild(div);
        });

        // Show admin panel if user is admin
        if (isAdmin) {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        // Generate invite code via API
        function generateInvite() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/user/invite', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    document.getElementById('invite-result').textContent = 'New invite code: ' + resp.code;
                } else {
                    document.getElementById('invite-result').textContent = 'Failed to generate invite code.';
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
