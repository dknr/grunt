{{define "message"}}<div class="message-row{{if not .ShowAvatar}} message-row--grouped{{end}}">
  <div class="avatar-col">
    {{if .ShowAvatar}}<div class="avatar">
      {{if .HasAvatar}}<img src="/api/user/avatar/{{.User}}" width="32" height="32" alt="">
      {{else}}{{template "avatar_svg" .}}{{end}}</div>{{end}}
    {{if .ShowTimestamp}}<span class="timestamp">{{.Timestamp}}</span>{{end}}
  </div>
  <div class="username-bubble-wrapper">
    {{if .ShowUsername}}<div class="msg-username"><h4>{{.User}}</h4></div>{{end}}
    <div class="message-bubble" data-id="{{.ID}}"><p>{{.RenderedContent}}</p></div>
  </div>
</div>{{end}}
